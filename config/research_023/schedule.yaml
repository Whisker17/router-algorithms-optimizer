# WHI-1627 research-023 paired campaign schedule (contract R023-C/1 §5.3, §8, §10, §13).
#
# The single machine-readable schedule of the 0.2.3 campaign for `split_polish` (E1) and
# `marginal_activation` (E2): inputs and their hashes, the shared settings, every arm with its
# generated profile, the stages and the pre-registered rules. Validated, rendered, executed,
# checked and tabulated ONLY by `tools/research_023/campaign.py` (`profiles`, `check`, `freeze`,
# `inputs`, `run`, `analyze`, `tables`); explained in docs/references/research-023/results.md. It
# reuses the 0.2.1 executor (`tools/research_021/campaign.py`: ledger, lanes, load sampler,
# `caffeinate`, `pmset` capture, the single infrastructure retry) and the 0.2.2 work pass
# (`tools/research_022/pruning_work.py`) by import; neither file is modified.
#
# Stages: T = the whole schedule on the TUNING split, a dry run that measures wall time and
# catches configuration errors (descriptive only, never tuned on); R = the REPORT split, executed
# ONCE from a fresh clone of the freeze commit (this file with `stages.R` settled from stage T),
# pushed before the first report-split solve. Nothing here tunes, re-selects a nominee or changes
# a setting of contract §4.7 / §5.2: every value below is the contract's or `config/full_gross.yaml`'s.
schema: r023.campaign/1
issue: WHI-1627
contract: {key: R023-C/1, path: docs/references/research-023/contract.md,
           sha256: 43775381d17cb7f1468c3a6b246e19571065e3a931eeb3445e73bd885f36af33}
probe_sums: {path: docs/references/research-023/probe/SHA256SUMS,
             sha256: 8e574c1e1cdb5b386e516e75b39978497698bacea5f84c22c4626ebb21da3a9a}
release: {version: 0.2.3, id: 430fe77b-107a-41d8-86f2-9ae0b5ffe991}
base_commit: 4f177705a807dbe97c2534ef2adfb7f639fffcad
holdout_exposure:
  tuning: exploration_data          # stage T only (dry run; the nominees were chosen here)
  report: previously_exposed        # 0.1.0, 0.2.0, 0.2.1, 0.2.2 (contract §8)
host:
  logical_cpus: 10
  load_sample_seconds: 30
  contaminated_if: load1 > 0.5 * logical_cpus

# ----------------------------------------------------------------------------- inputs
# `source` is relative to the primary clone; `inputs` copies each into the durable inputs root
# (outside every worktree) and refuses a copy whose manifest.json sha256 differs.
