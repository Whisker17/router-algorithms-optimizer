# Verified five-source admission catalog (WHI-1426 / I01).
#
# Machine-readable half of the catalog: chain/contract identity, per-contract
# Keccak-256 code hashes (pinned at the candidate block below; `snapshot/
# preflight.py` re-checks every run and rejects on drift), and known evidence
# blockers. The narrative (how each fact was established, Solidity->Python
# migration plans, license audits, Dune-emitter-to-pool validation strategy,
# tick/bin recovery method) lives in docs/references/protocol-admission.md —
# read that file first; this one is the checkable data it cites.
#
# Revision note (2026-09-24, second pass): the first pass of this catalog wrongly
# concluded explorer-verified source was unavailable ("api.mantlescan.xyz requires
# a paid key") and left Agni v3/FusionX v3 as unconfirmed "candidate" upstream pins
# and Merchant Moe Classic v1 as `confidence: unmatched`. A supervisor review
# pointed at a free, keyless Etherscan-compatible endpoint
# (api.routescan.io/v2/network/mainnet/evm/5000/etherscan/api) that *is* reachable
# and returns verified source for nearly every contract below, plus two
# first-party GitHub repos (merchant-moe/moe-core, agni-protocol/contracts,
# FusionX-Finance/v3-contracts) this pass had not searched for. Every address
# below was then re-verified against explorer-verified source and/or an
# independent local `forge build` bytecode comparison (documented per source in
# protocol-admission.md). This revision corrects every confidence level and
# removes the now-resolved "explorer access blocked" blockers; it does not
# silently expand scope beyond the five configured sources.

