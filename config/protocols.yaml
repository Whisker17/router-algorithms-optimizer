# Verified five-source admission catalog (WHI-1426 / I01).
#
# Machine-readable half of the catalog: chain/contract identity, the checks
# `snapshot/preflight.py` runs against them, and known evidence blockers. The
# narrative (how each fact was established, Solidity->Python migration plans,
# license audits, Dune-emitter-to-pool validation strategy, tick/bin recovery
# method) lives in docs/references/protocol-admission.md — read that file first;
# this one is the checkable data it cites.
#
# Every address below was independently re-derived from at least one of:
#   (a) a direct eth_call/eth_getCode against the public Mantle RPC at the
#       candidate_block below (recorded per-source as "onchain_*" in
#       protocol-admission.md's verification tables), or
#   (b) a source's own current official documentation site fetched at
#       catalog-authoring time (recorded per-source as "official_docs"), or
#   (c) Uniswap Labs' own signed deployments feed (developers.uniswap.org).
# No address here was accepted from a search engine snippet, a GeckoTerminal pool
# listing alone, or an LLM's prior knowledge without an (a)/(b)/(c) cross-check.

