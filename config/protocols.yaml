        clone whose embedded implementation address decodes to exactly
        pair_implementation above (which matches docs.merchantmoe.com's published
        "MoePair" address byte-for-byte); lfj-gg/joe-core's JoeFactory.createPair
        uses `create2` with JoePair's *full* creationCode, never a clone -
        architecturally incompatible. (2) pair_implementation's own CBOR metadata
        reports `solc=0x000814` (0.8.20); JoeFactory.sol/JoePair.sol at
        lfj-gg/joe-core@master are `pragma solidity =0.6.12`. Moe Classic v1 is
        therefore a *different*, unidentified Solidity implementation that
        happens to be behaviorally Uniswap-V2-shaped (getPair/allPairsLength/
        getReserves round-trip correctly, confirmed on-chain) deployed via clone
        factory. No matching upstream source has been found.
