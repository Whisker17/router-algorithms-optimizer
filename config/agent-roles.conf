# Agent role → dispatch mapping.
#
# Read by scripts/agent-dispatch.sh; explained in docs/agents/runtime.md.
# Shell-sourced, so: KEY="value", no spaces around `=`, no secrets (API keys stay
# in .env — this file is checked in).
#
# Four roles. Each needs a _CMD (how to reach it as a subprocess) and a _MODEL
# (which model it should run, for runtimes that dispatch natively instead).
#
#   IMPLEMENTER  the session reading this. Never dispatched — it is the caller.
#   REVIEWER     fresh context, >= implementer strength. Ideally a DIFFERENT vendor
#                than IMPLEMENTER: independent failure modes catch more than a
#                stronger model sharing the implementer's blind spots.
#   ESCALATOR    strongest reasoner available. Resolves findings the review loop
#                could not close. May equal REVIEWER.
#   EXPLORER     cheap and fast, read-only codebase sweeps. Parallelised heavily,
#                so cost matters more than depth here.
#
# _CMD must be a NON-INTERACTIVE invocation that takes a prompt on stdin and
# writes the result to stdout. Verify yours with `--help` before trusting it —
# these flags change between CLI releases. `scripts/agent-dispatch.sh --probe`
# checks that the binary resolves; it cannot check that the flags are right.

# --- Claude Code -------------------------------------------------------------
# `claude -p` is print mode (non-interactive). `--model` takes a generation alias
# (`opus`, `sonnet`, `haiku`) or a pinned id.
IMPLEMENTER_LABEL="claude-code:sonnet"

REVIEWER_CMD="claude -p --model opus"
REVIEWER_MODEL="opus"

ESCALATOR_CMD="claude -p --model opus"
ESCALATOR_MODEL="opus"

EXPLORER_CMD="claude -p --model sonnet"
EXPLORER_MODEL="sonnet"

# --- Other runtimes ----------------------------------------------------------
# Uncomment and CORRECT the one you use, then re-run `--probe`. The command
# shapes below are unverified starting points, not known-good invocations.
#
# Codex CLI:
#   REVIEWER_CMD="codex exec --model <reviewer-model>"
#   ESCALATOR_CMD="codex exec --model <strongest-model>"
#
# Any runtime with no non-interactive mode of its own (e.g. a chat-only agent):
# keep the Claude Code lines above and install the `claude` CLI purely as a
# review sidecar. Cross-vendor review is the preferred configuration anyway —
# see docs/agents/runtime.md § Choosing a reviewer.
