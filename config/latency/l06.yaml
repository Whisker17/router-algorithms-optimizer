# L06 (WHI-1508): PRE-REGISTERED bounded quality diagnostics of the opt-in `uni_sor_fast`
# candidate-shortlist variant against its same-scope reference `uni_sor_port`.
#
# Registered and committed BEFORE any L01-matrix or sentinel solve of `uni_sor_fast`
# (before this commit it had only run on the checked-in synthetic/test fixtures, as unit
# tests). Changing any value below is a new `version`, never a reinterpretation.
#
# Read by tools/latency/l06_sor_shortlist.py. This is NOT an L01 experiment and gives no
# adopt verdict: there is no default loss tolerance, and timing here is a single-shot
# in-process diagnostic. The final performance / quality trade-off and any adoption belong
# to WHI-1510.
schema: l06-shortlist/1
key: L06
version: 1

# Inputs, all read-only: the L01 protocol (its matrix and splits), the L01 experiment whose
# derived bundles and uni_sor_port baseline records are reused, and the unchanged daily
# gross profile (search max_hops 2 / max_splits 4 / percent_step 5, budget, seed, objective).
l01_protocol:
  path: config/latency/l01.yaml
  sha256: 961fb52208c7baac3d0ffe492cef89818498543f1f00f56217d2f99113e27f1b
l01_experiment: 20260926T090434484129Z-d5061563
profile:
  path: config/daily_gross.yaml
  sha256: 577b43ebc2d23f1d4d896501471b104013ca86e4d33f2b8315722f3bb5680c11
bundles: [full_source/matrix, sor_compatible/matrix, full_source/sentinel, sor_compatible/sentinel]

reference: uni_sor_port
candidate: uni_sor_fast

# The complete bounded sweep: probe sets x routes_per_probe x direct_routes, in this order
# (the order is the final nomination tie-break). Probe sets were chosen a priori: the
# full-input incumbent only; plus the smallest grid size (small splits); plus a middle size.
sweep:
  probe_percents: [[100], [5, 100], [5, 25, 100]]
  routes_per_probe: [2, 4, 8]
  direct_routes: [0, 4]

phases:
  # Every sweep setting on the L01 tuning split, both cohorts. The sentinel (both cohorts)
  # is run for every setting too but is reported apart and never enters the nomination.
  tuning: {split: tuning, sentinel: true}
  # Run once, after the tuning results are committed, on the L01 held-out split (both
  # cohorts) for exactly two settings: the tuning nomination and the fixed aggressive
  # setting. The held-out results cannot change either choice.
  held_out: {split: held_out, sentinel: false}

# Nomination: computed from the tuning split only, lexicographically, with NO loss
# tolerance: (1) fewest reference-ok -> candidate-non-ok status regressions, (2) smallest
# maximum regret (bps), (3) smallest summed regret (bps), (4) fewest counted quotes, (5)
# sweep order. Quality-first by construction; it is not an adoption recommendation.
nomination: [status_regressions, max_regret_bps, sum_regret_bps, quotes_counted, sweep_order]
# Fixed a priori (not from any result): the cheapest setting, so the held-out split also
# shows the loss side of the trade-off.
aggressive: {probe_percents: [100], routes_per_probe: 2, direct_routes: 0}

# Regret per (bundle, case) = (reference score - candidate score) x 10,000 / reference score
# on the same bundle, cohort, objective (gross) and budget. N/A (never 0) when the reference
# is not ok or its score is not positive, and when the candidate is not ok (then counted as a
# status regression). Negative regret (candidate better) is reported as is, never clamped.
heuristic_default_loss_tolerance: null
