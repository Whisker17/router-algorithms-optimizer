# cfmm_dual CL comparison profile (WHI-1559; docs/references/research-021/cfmm-dual.md §8, §10
# "bounded comparison recipe", §11.2): the current preset cfmm_dual/2 (CL stage: admitted
# constant-product + uniswap_v3/agni_v3/fusionx_v3 concentrated markets) next to its matched
# controls path_split and incremental_graph under ONE shared objective, search values and
# budget. Replay it literally with `main.py run|quote --strategies profile`.
#
# Disclosure by cohort (the report's `matched`/`coverage` reading follows the bundle cohort):
# - matched V2/V3 cohort (`sor_cohort_*`, SOR-compatible CPMM + CL pools only): every pool
#   the controls can use is also a cfmm_dual market candidate; class `incomparable_domain`
#   (recovered continuous flows vs a percentage grid), side by side, never ranked as a
#   mechanism gain;
# - full five-source cohort (`bundle_*`): the controls also route through Liquidity Book,
#   which cfmm_dual never models -> `expanded_protocol` coverage; an LB-only case is a
#   visible `unsupported (protocol_ceiling)` row, never omitted.
# The CPMM-only ablation is config/cfmm_dual/cpmm.yaml (preset cfmm_dual/1, unchanged): run it
# on the same bundle for the `cfmm_cpmm_vs_cl` stage comparison (class expanded_protocol).
#
# search/graph/budget repeat config/full_gross.yaml (3 hops, 4 splits, 5% grid, 50 chunks,
# 900 s / 300000 quotes). SMOKE-SCALE and UNVALIDATED here (one measured attempt, no warmup):
# the profile exists for the run/quote CLI checks and the preset demonstration, not as a
# performance campaign (that is WHI-1562's); no speed or quality claim.
schema_version: 2
algorithms:
  - path_split
  - incremental_graph
  - cfmm_dual
objective:
  mode: gross_only
search:
  max_hops: 3
  max_splits: 4
  percent_step: 5
graph:
  chunks: 50
budget:
  time_limit_seconds: 900
  max_quotes: 300000
  max_candidates: null      # explicitly no cap (it would cap fallback_paths_evaluated)
algorithm_options:
  cfmm_dual:                         # = preset_v2.yaml, so it resolves as {kind: preset}
    market_protocols: constant_product+concentrated
    max_iterations: 200
    max_function_evaluations: 600
    lbfgs_memory: 30
    pgtol: 1.0e-9
    ftol: 1.0e-15
    residual_tolerance: 1.0e-5
    log_price_bound: 10.0
    min_split_share: 1.0e-3
    max_recovery_attempts: 8
    cycle_resolve: true
    fallback: single_path
measurement:
  warmup: 0
  repeats: 1
  seed: 1559
  order: fixed
  memory_pass: false
worker:
  start_method: spawn
  scope: algorithm
  prepare_time_limit_seconds: 120
