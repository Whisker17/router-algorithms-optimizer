# Bounded comparison preset `cfmm_dual/2` of `cfmm_dual` (WHI-1559, R021-P12; CL stage:
# admitted constant-product + concentrated-liquidity markets; docs/references/research-021/
# cfmm-dual.md §8, §9.3, §11.2 G-L7; contract R021-C/1 §7.1). The current preset: `--strategies
# all` writes these values out for a source that does not configure cfmm_dual. It replaces
# nothing: `cfmm_dual/1` (preset_v1.yaml, CPMM stage) stays a frozen historical pin and the
# CPMM-only ablation (config/cfmm_dual/cpmm.yaml).
# Frozen: its sha256 is pinned in routing/algorithms/cfmm_dual.py (`PRESET`) and a changed
# file is refused. It holds only this identity's algorithm_options; search.max_hops (the
# market universe bound) and the wall/quote/candidate budget come from the run profile.
#
# Chosen on `sor_cohort_tuning` (b900b866...7ade, 96 cases) ONLY, within the registered §9.3
# ranges, by a stated rule (fewest cases below the best exact single path over the same
# markets by > 1 bp, then the smallest worst case, then most cases above it); grid
# min_split_share {1e-6, 1e-4, 1e-3} x log_price_bound {50, 20, 10} x lbfgs_memory {10, 30}
# plus one-at-a-time ablations of the other keys (evidence in the WHI-1559 PR). Every other
# value is cfmm_dual/1's. Tuning exposure only: no performance or quality claim, and the
# initial CL solve rarely meets residual_tolerance on real states (a disclosed limitation,
# not relabelled by loosening the tolerance).
key: R021-P12-cfmm_dual
version: 2
algorithm: cfmm_dual
options:
  market_protocols: constant_product+concentrated
  max_iterations: 200
  max_function_evaluations: 600
  lbfgs_memory: 30
  pgtol: 1.0e-9
  ftol: 1.0e-15
  residual_tolerance: 1.0e-5
  log_price_bound: 10.0
  min_split_share: 1.0e-3
  max_recovery_attempts: 8
  cycle_resolve: true
  fallback: single_path
