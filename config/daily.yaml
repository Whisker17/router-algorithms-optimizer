# DAILY profile (WHI-1447 / I21): all six mandatory algorithms, every source, every case
# of the bundle it is given -- but a SMALLER declared search than config/full.yaml
# (`search.max_hops: 2`), so a pass takes minutes, not hours. Under the frozen,
# holdout-validated empirical cost model; its gross-only twin is config/daily_gross.yaml
# (identical except `objective`; a test enforces that). It is a regression / quick
# comparison profile, NOT the acceptance comparison: on the tuning split its 2-hop split
# searches fall 13-15 bps (mean) short of the 3-hop best known (v1-acceptance.md §3).
# Parameter provenance (DESIGN §2.12; calibrated on the 96-case TUNING split only):
#   search.max_hops 2      DECLARED REDUCTION from the trial value 3 (cost, not quality):
#                          ~1/10 of the 3-hop solve time per case.
#   search.max_splits 4    DESIGN trial value, not swept (unvalidated).
#   search.percent_step 5  DESIGN trial value, kept (2-hop sweep 10/5/4/2, as in full).
#   graph.chunks 200       CALIBRATED at 2 hops (swept 10/20/40/50/100/200 x step 10/5/2):
#                          shortfall vs the sweep's best known falls monotonically with
#                          chunks (mean 0.005 bps at 200 vs 0.34 at 50) for +30% time.
#   budget                 CALIBRATED from 2-hop tuning-split observations: largest solve
#                          5.9 s (incremental_graph, 2% grid) / 5.2 s (uni_sor_port) and
#                          7,868 quotes. Limits leave ~20x time and ~6x quote headroom; a
#                          case beyond them is an honest `timeout`, never dropped.
#   measurement            1 discarded warmup + 3 measured attempts per case (median
#                          latency; `attempts_consistent` also rechecks determinism), plus
#                          a separate tracemalloc memory pass.
schema_version: 2
algorithms:
  - direct
  - single_path
  - direct_split
  - path_split
  - incremental_graph
  - uni_sor_port
objective:
  mode: empirical_cost
  cost_model: config/costs/mantle-101082044-cost-v1.json
  cost_model_sha256: 50e89727d6b6ac869c14c837c7cdec8099efc897d201794640912f3f6b4b7e71
search:
  max_hops: 2
  max_splits: 4
  percent_step: 5
graph:
  chunks: 200
budget:
  time_limit_seconds: 120
  max_quotes: 50000
  max_candidates: null      # explicitly no candidate cap: quotes/time bound every search
measurement:
  warmup: 1
  repeats: 3
  seed: 1447
  order: fixed
  memory_pass: true
worker:
  start_method: spawn
  scope: algorithm
  prepare_time_limit_seconds: 120   # observed prepare + start-up < 0.2 s
