# ----------------------------------------------------------------------------- profiles
# `path`+`sha256`: an existing checked-in file used as is (never edited). `generate`: a file
# under config/research_021/profiles/ rendered from its `base` by `campaign.py profiles`;
# `check` refuses a checked-in file whose bytes differ from the rendering (no drift).
profiles:
  canonical_gross: {path: config/full_gross.yaml,
                    sha256: 51a8a65184ae765867fd9d7763776852b2b4576e3cf7116a8dc15ccd87028177}
  canonical_net: {path: config/full.yaml,
                  sha256: a99f33f8547a03ec6ff16f354b409a742d61db56921c45f88cbc26eb0887fab6}
  l3: {path: config/metis_challenge/m3.yaml,            # WHI-1449 M3 = R021 L3
       sha256: 0cbff3c7483be2aaafd29e30fe47d15a07b34b5297fd3783a72f73d091e3df96}
  e4: {path: config/metis_challenge/m4_off.yaml,        # WHI-1449 M4-off = R021 E4
       sha256: bcf8bf15aa2bb48d6f47e645ae23cd0654843e1cc7291c8d713093476c20a7f2}
  s3:
    generate: {base: canonical_gross, algorithms: [metis_history], graph: {label_hops: 3},
               options: {metis_history: {preset: current}}}
    purpose: "S3: metis_history bounded preset v1 at graph.label_hops 3 (R021-C/1 §6.2)"
  s3_off:
    generate: {base: canonical_gross, algorithms: [metis_history], graph: {label_hops: 3},
               options: {metis_history: {preset: current, set: {dominance: "off"}}}}
    purpose: "S3 control: dominance off (must equal E3 unless a side truncates; history-labels.md §9.1)"
  s4_off:
    generate: {base: canonical_gross, algorithms: [metis_history], graph: {label_hops: 4},
               options: {metis_history: {preset: current, set: {dominance: "off"}}}}
    purpose: "S4 control: dominance off (must equal E4 unless a side truncates; history-labels.md §9.1)"
  repair_off:
    generate: {base: canonical_gross, algorithms: [incremental_graph_repair],
               options: {incremental_graph_repair: {preset: current, set: {repair: false}}}}
    purpose: "repair_off_on control: preset v1 values with repair false (suffix-repair.md §7)"
  cfmm_cpmm:
    generate: {base: canonical_gross, algorithms: [cfmm_dual],
               options: {cfmm_dual: {preset: historical_v1}}}
    purpose: "cfmm_cpmm_vs_cl CPMM-only stage: the historical cfmm_dual/1 pin (cfmm-dual.md §9.3, §10)"
  alloc_ms1:
    generate: &alloc {base: canonical_gross, search: {max_splits: 1},
                      algorithms: [direct_split, path_split, direct_split_certified],
                      options: {direct_split_certified: {preset: current}}}
    purpose: "max_splits_scan (allocation-governed direct/path split + certified), value 1"
  alloc_ms2:
    generate: {<<: *alloc, search: {max_splits: 2}}
    purpose: "max_splits_scan (allocation-governed direct/path split + certified), value 2"
  alloc_ms8:
    generate: {<<: *alloc, search: {max_splits: 8}}
    purpose: "max_splits_scan (allocation-governed direct/path split + certified), value 8"
  sor_ms1:
    generate: &sor {base: canonical_gross, search: {max_splits: 1},
                    algorithms: [uni_sor_port, uni_sor_adaptive, uni_sor_optimized,
                                 uni_sor_cycle_safe],
                    named_strategies: [uni_sor_adaptive, uni_sor_optimized],
                    options: {uni_sor_cycle_safe: {preset: current}}}
    purpose: "max_splits_scan (allocation-governed SOR family incl. cycle-safe), value 1"
  sor_ms2:
    generate: {<<: *sor, search: {max_splits: 2}}
    purpose: "max_splits_scan (allocation-governed SOR family incl. cycle-safe), value 2"
  sor_ms8:
    generate: {<<: *sor, search: {max_splits: 8}}
    purpose: "max_splits_scan (allocation-governed SOR family incl. cycle-safe), value 8"
  net_empirical:
    generate: {base: canonical_net, algorithms: [direct_split_certified, cfmm_dual],
               options: {direct_split_certified: {preset: current}, cfmm_dual: {preset: current}}}
    purpose: "gross-only identities under the empirical-cost net objective: every row visible unsupported"
  memory_gross:
    generate: {base: canonical_gross, measurement: {memory_pass: true}}
    purpose: "stage M: canonical_gross plus the separate tracemalloc memory pass (run with --strategies all)"

# The ordinary 14-strategy roster `--strategies all` derives from canonical_gross.
rosters:
  all14: &all14 [direct, single_path, direct_split, path_split, incremental_graph, uni_sor_port,
                 uni_sor_adaptive, uni_sor_optimized, metis_inspired, metis_history,
                 direct_split_certified, incremental_graph_repair, uni_sor_cycle_safe, cfmm_dual]
  base6: &base6 [direct, single_path, direct_split, path_split, incremental_graph, uni_sor_port]
  optimized2: &optimized2 [uni_sor_adaptive, uni_sor_optimized]
  alloc3: &alloc3 [direct_split, path_split, direct_split_certified]
  sor4: &sor4 [uni_sor_port, uni_sor_adaptive, uni_sor_optimized, uni_sor_cycle_safe]

# ----------------------------------------------------------------------------- stages
stages:
  T:
    split: tuning
    owner: component A (before any report-split solve)
    lanes: 5                        # concurrent invocations; timing is descriptive/contaminated
    order: registered               # launch order below; longest first
  L:
    split: mixed (L01 matrix tuning + held-out twins, sentinel)
    owner: component B, first, alone on the host (no other stage runs concurrently)
    lanes: 1
    launch_gate: {samples: 5, interval_seconds: 30, headroom_load1: 3.0, rule: "headroom only, never a validity rule; host busy -> not launched, blocker reported; no waiting loop, no retry"}
  R:
    split: report
    owner: component B, after L
    lanes: 3
    order: registered
  M:
    split: mixed (L01 full-source matrix)
    owner: component B, after R
    lanes: 1
  I:
    split: sentinel / saved quote requests (no corpus split)
    owner: component B, last, alone on the host
    lanes: 1

# kind: run | quote | report | replay | order_check | replay_saved | latency_run |
#       latency_sufficient | latency_compare. `derive` adds report / replay / order_check
#       children (ids <id>.report, <id>.replay, <id>.order) that depend on it.
invocations:
  # ---- T: tuning-only registered exploration (component A)
  - {id: T-roster-full, stage: T, kind: run, bundle: tuning_full, profile: canonical_gross, strategies: all, algorithms: *all14}
  - {id: T-roster-sor, stage: T, kind: run, bundle: tuning_sor, profile: canonical_gross, strategies: all, algorithms: *all14}
  - {id: T-e4, stage: T, kind: run, bundle: tuning_full, profile: e4, strategies: profile, algorithms: [metis_inspired]}
  - {id: T-s4off, stage: T, kind: run, bundle: tuning_full, profile: s4_off, strategies: profile, algorithms: [metis_history]}
  - {id: T-sor-ms8, stage: T, kind: run, bundle: tuning_sor, profile: sor_ms8, strategies: profile, algorithms: *sor4}
  - {id: T-sor-ms2, stage: T, kind: run, bundle: tuning_sor, profile: sor_ms2, strategies: profile, algorithms: *sor4}
  - {id: T-sor-ms1, stage: T, kind: run, bundle: tuning_sor, profile: sor_ms1, strategies: profile, algorithms: *sor4}
  - {id: T-l3, stage: T, kind: run, bundle: tuning_full, profile: l3, strategies: profile, algorithms: [metis_inspired]}
  - {id: T-s3, stage: T, kind: run, bundle: tuning_full, profile: s3, strategies: profile, algorithms: [metis_history]}
  - {id: T-s3off, stage: T, kind: run, bundle: tuning_full, profile: s3_off, strategies: profile, algorithms: [metis_history]}
  - {id: T-repair-off-full, stage: T, kind: run, bundle: tuning_full, profile: repair_off, strategies: profile, algorithms: [incremental_graph_repair]}
  - {id: T-repair-off-sor, stage: T, kind: run, bundle: tuning_sor, profile: repair_off, strategies: profile, algorithms: [incremental_graph_repair]}
  - {id: T-cfmm-cpmm-full, stage: T, kind: run, bundle: tuning_full, profile: cfmm_cpmm, strategies: profile, algorithms: [cfmm_dual]}
  - {id: T-cfmm-cpmm-sor, stage: T, kind: run, bundle: tuning_sor, profile: cfmm_cpmm, strategies: profile, algorithms: [cfmm_dual]}
  - {id: T-alloc-ms8-full, stage: T, kind: run, bundle: tuning_full, profile: alloc_ms8, strategies: profile, algorithms: *alloc3}
  - {id: T-alloc-ms8-sor, stage: T, kind: run, bundle: tuning_sor, profile: alloc_ms8, strategies: profile, algorithms: *alloc3}
  - {id: T-alloc-ms2-full, stage: T, kind: run, bundle: tuning_full, profile: alloc_ms2, strategies: profile, algorithms: *alloc3}
  - {id: T-alloc-ms2-sor, stage: T, kind: run, bundle: tuning_sor, profile: alloc_ms2, strategies: profile, algorithms: *alloc3}
  - {id: T-alloc-ms1-full, stage: T, kind: run, bundle: tuning_full, profile: alloc_ms1, strategies: profile, algorithms: *alloc3}
  - {id: T-alloc-ms1-sor, stage: T, kind: run, bundle: tuning_sor, profile: alloc_ms1, strategies: profile, algorithms: *alloc3}
  - {id: T-net-full, stage: T, kind: run, bundle: tuning_full, profile: net_empirical, strategies: profile, algorithms: [direct_split_certified, cfmm_dual]}
  - {id: T-net-sor, stage: T, kind: run, bundle: tuning_sor, profile: net_empirical, strategies: profile, algorithms: [direct_split_certified, cfmm_dual]}
  - {id: T-quote-smoke, stage: T, kind: quote, bundle: tuning_full, profile: canonical_gross, strategies: all, details: true, request: tuning_smoke, algorithms: *all14, derive: [report, replay, order_check]}

  # ---- L: L02-L05 reassessment through the real L08 arm commands (component B, alone)
  - {id: L-R, stage: L, kind: latency_run, arm: R, bundle: full}
  - {id: L-R-sb, stage: L, kind: latency_sufficient, arm: R, bundle: full, after: [L-R]}
  - {id: L-E1, stage: L, kind: latency_run, arm: E1, bundle: full, after: [L-R-sb]}
  - {id: L-E1-sb, stage: L, kind: latency_sufficient, arm: E1, bundle: full, after: [L-E1]}
  - {id: L-E2, stage: L, kind: latency_run, arm: E2, bundle: full, after: [L-E1-sb]}
  - {id: L-E2-sb, stage: L, kind: latency_sufficient, arm: E2, bundle: full, after: [L-E2]}
  - {id: L-E3, stage: L, kind: latency_run, arm: E3, bundle: full, after: [L-E2-sb]}
  - {id: L-E3-sb, stage: L, kind: latency_sufficient, arm: E3, bundle: full, after: [L-E3]}
