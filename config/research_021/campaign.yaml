  - {id: L-cmp-L02, stage: L, kind: latency_compare, baseline: L-R, candidate: L-E1, lane: exact}
  - {id: L-cmp-L03, stage: L, kind: latency_compare, baseline: L-E1, candidate: L-E2, lane: exact}
  - {id: L-cmp-L04, stage: L, kind: latency_compare, baseline: L-E2, candidate: L-E3, lane: exact}
