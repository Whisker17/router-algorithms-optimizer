  - {id: L-cmp-R-E4, stage: L, kind: latency_compare, baseline: L-R, candidate: L-E4, lane: exact}

  # ---- R: frozen report-split comparison (component B, after freeze acceptance)
  - {id: R-roster-full, stage: R, kind: run, bundle: report_full, profile: canonical_gross, strategies: all, algorithms: *all14, derive: [report]}
  - {id: R-roster-sor, stage: R, kind: run, bundle: report_sor, profile: canonical_gross, strategies: all, algorithms: *all14, derive: [report]}
  - {id: R-e4, stage: R, kind: run, bundle: report_full, profile: e4, strategies: profile, algorithms: [metis_inspired], derive: [report]}
