# Report-stage comparisons mirror stage T with R-* invocations (`mirror: {T: R}` replaces the
# T- prefix and tuning bundles by R- and report bundles); defect cases are listed apart.
report_mirror:
  from_stage: T
  to_stage: R
  invocation_map:
    T-roster-full: R-roster-full
    T-roster-sor: R-roster-sor
    T-e4: R-e4
    T-l3: R-l3
    T-s3: R-s3
    T-s3off: R-s3off
    T-s4off: R-s4off
    T-repair-off-full: R-repair-off-full
    T-repair-off-sor: R-repair-off-sor
    T-cfmm-cpmm-full: R-cfmm-cpmm-full
    T-cfmm-cpmm-sor: R-cfmm-cpmm-sor
    T-net-full: R-net-full
    T-net-sor: R-net-sor
  exclude_kinds: [nominee]          # no tuning on the report split
  known_defects_apart: [cycle.sor, cycle.full]

# Filled by component A from the stage-T nominee comparisons (`apply: true`) BEFORE any
# report-split solve; each non-canonical nominee adds one R-stage invocation pair.
nominees: null

# ----------------------------------------------------------------------------- rules
rules:
  nominee: >-
    For each `kind: nominee` comparison, over every scheduled (case, algorithm) of its
    algorithms on its tuning bundles: failures(v) = cells with status timeout, invalid_plan,
    algorithm_error, model_error, incomplete_snapshot, cancelled or missing; shortfall(v) =
    cells ok at some scanned value but at v not ok, or ok with gross below that cell's best
    gross over all scanned values. Nominee = the smallest v with shortfall(v) = 0 and
    failures(v) = min over the scan; if none qualifies, the canonical value 4. No loss
    tolerance, no timing criterion; `apply: false` results are informational only.
    Registered before any tuning observation (tools/research_021/analysis.py `nominee`).
  statuses: >-
    Every scheduled cell keeps its status (ok, no_route, unsupported, timeout, invalid_plan,
    incomplete_snapshot, model_error, algorithm_error, cancelled, missing); unconditional
    counts use the full schedule. Paired quality uses common-OK cells only; a missing score
    is N/A, never 0; a zero baseline gross is N/A, counted apart.
  ties: >-
    Exact integer gross comparison: equal gross is a tie (neither higher nor lower); no money
    tolerance. Solver-internal tie rules are each identity's research contract's.
  numerical_tolerances: >-
    None added. Protocol math and evaluation are exact integers. cfmm_dual's residual
    tolerance is its pinned preset value (a numerical residual criterion, never a bound);
    float ratios (recovered/estimate, geometric means) are reported, never thresholded.
  stops_fallback_failure: >-
    As each identity's research contract (history-labels.md §7, integer-allocation.md §5.4-5.6,
    suffix-repair.md §5.7, cycle-safe-sor.md §4.5-4.7, cfmm-dual.md §5.4, §6-6.1). A fallback
    plan is labelled from the record (`search_stats.r021.fallback`, `search.cfmm.fallback`),
    never counted as the mechanism's result; a budget-bound cell proves no identity.
  timing: >-
    L01 labels (latency-baseline.md §4). A batch window whose sampled 1-minute load exceeds
    0.5 x logical CPUs, or has no sample, is `inconclusive`; one sample per case gives no A/A
    noise floor, so batch timing is descriptive only. Speed verdicts exist only in stage L via
    `report.latency compare` (L01 rules verbatim). No single-request percentile, no SLA, no
    total-campaign runtime ceiling.
  infrastructure_deviation: >-
    An invocation whose process ends without a complete manifest because of infrastructure
    (host restart, OOM kill, disk full, tool/auth failure; evidence recorded) may be re-executed
    ONCE into a fresh slot `<id>.retry1`; the failed attempt stays in the ledger and is reported
    as a deviation. A completed run is never re-executed, whatever its statuses or timings;
    solver timeouts/failures are outcomes, never retry reasons; host load is never a retry reason.
  disposition: >-
    Per identity (R021-C/1 §8): reject if a registered gate fails (correctness, determinism,
    accounting, identity/P1, certificate validity, unsupported-scope rule) or a pre-registered
    hypothesis is refuted; inconclusive if every gate passes but a primary question cannot be
    evaluated (zero eligible cells, missing/incomplete records, coverage); keep_experimental
    otherwise. A functional implementation needs no win; no adoption, no loss tolerance.
