# WHI-1562 research-021 paired campaign manifest (R021-P14; contract R021-C/1).
#
# The single machine-readable schedule of the 0.2.1 strategy campaign: inputs and their
# hashes, every profile (checked-in, pinned or generated from the canonical base), every
# invocation of every stage with its exact expected algorithm order and row inventory, the
# registered comparisons, and the pre-registered rules. Validated, expanded, executed and
# analysed ONLY by `tools/research_021/campaign.py` (`check`, `profiles`, `schedule`,
# `execute`, `analyze`); explained in docs/references/research-021/preregistration.md.
#
# Stages: T = tuning-only registered exploration (component A, WHI-1562; executed before any
# report-split solve); L, R, M, I = the frozen report campaign (component B; executed only
# after the parent accepts the freeze). Nothing here is an adoption, default change, loss
# tolerance or runtime ceiling; heuristic_default_loss_tolerance stays null.
schema: r021.campaign/1
issue: WHI-1562
publication_key: R021-P14
contract: R021-C/1
release: {version: 0.2.1, id: ed16e106-fa3e-4b8a-b022-e7208eb8ef41}
release_baseline_b: 81559ab16376cf46416a69727c3ca0b45e72771a
base_commit: 26c0cd0c2008fe22b8ac3273c1360003bbd0c791
heuristic_default_loss_tolerance: null
holdout_exposure:
  tuning: exploration_data
  report: previously_exposed        # WHI-1447, WHI-1503..1510, WHI-1449 (R021-C/1 §6.1)
host:
  logical_cpus: 10                  # reference Apple M2 Pro; checked at execution time
  load_sample_seconds: 30
  contaminated_if: load1 > 0.5 * logical_cpus

