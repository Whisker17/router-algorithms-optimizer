# Smoke profile (WHI-1427): the smallest run configuration that exercises the
# offline synthetic bundle end-to-end. See config/README.md for the general
# YAML-config convention and docs/DESIGN.md §2.12 for the parameter table.
#
# gross-only is the only objective mode with empirical standing before a real
# cost model is calibrated (docs/DESIGN.md §2.9) -- this profile never claims a
# net-output result.
schema_version: 1
algorithms:
  - direct
objective:
  mode: gross_only
