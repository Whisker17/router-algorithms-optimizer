# WHI-1631 research-024 preset selection schedule (contract R024-C/1 §4, §5, §10.1, §12).
#
# The single machine-readable schedule of the 0.2.4 preset selection for `split_polish` (E1, 90
# candidates) and `marginal_activation` (E2, 108 candidates) under the selection profile P*: the
# input and its hashes, the P* rendering, the candidate grids, the five reference arms, the reuse
# list, the registered rule and the two stages. Validated, rendered, executed, checked and
# analysed ONLY by `tools/research_024/selection.py` (`profiles`, `check`, `freeze`, `inputs`,
# `reuse`, `run`, `analyze`, `presets`, `tables`); the rule itself is
# `tools/research_024/r024_rule.py`. It reuses the 0.2.1 executor (`tools/research_021/campaign.py`:
# ledger, lanes, 30-s load sampler, `caffeinate`, `pmset` capture, the single infrastructure
# retry) through the 0.2.2 driver (`tools/research_022/pruning_campaign.py execute`, which adds the
# untimed work pass `tools/research_022/pruning_work.py`); no earlier file is modified.
#
# This file and every generated profile were committed and PUSHED BEFORE THE FIRST NEW TUNING
# SOLVE (§5.3 item 1); every stage runs from a fresh clone of exactly the pushed commit. Every
# value below is the contract's (§12) or `config/full_gross.yaml`'s; `check` refuses any
# difference from the contract registry. Nothing here is tuned after observation.
#
# Stages (the 0.2.1 executor's stage letters):
#   T  the selection grid: every non-reused candidate and reference arm, one ordinary run plus one
#      untimed work pass each, on `tuning_full` only. Its analysis applies the rule (§5.7).
#   I  after the winners are fixed by T's pinned analysis: per selected identity the preset run
#      (§6.2: the committed preset file rendered under P*, ordinary run) and the sensitivity arms
#      of §5.10 (winner arm and base arm at graph.chunks 100 and 200, ordinary runs only). Its
#      inventory is a function of the pinned T analysis and the code of this commit; its generated
#      profiles are committed and pushed before it runs. Nothing in stage I can change a winner.
schema: r024.selection/1
issue: WHI-1631
contract: {key: R024-C/1, path: docs/references/research-024/contract.md,
           sha256: d458fbdefc501369cd10ec9d3d3527534df82d93cab20ff9af6dbd9ffe884065}
release: {version: 0.2.4, id: 0beaa4c3-2721-4618-b687-ac70d4d54e6a}
base_commit: 0cf3fce7fa6851e840f9d421577a81229ed328cf
holdout_exposure:
  tuning: exploration_data          # already used to choose the 0.2.3 nominees (contract §3)
  report: never_read                # §5.3 item 2: no report bundle in any input, ledger, manifest
host:
  logical_cpus: 10
  load_sample_seconds: 30

# ----------------------------------------------------------------------------- input
# `source` is relative to the primary clone; `inputs` copies it into the durable inputs root
# (outside every worktree) and refuses a copy whose manifest.json / cases.jsonl sha256 differs.
inputs:
  tuning_full:
    source: data/corpus/mantle-5src-101082044/bundle_tuning
    bundle_hash: ee7afa7e2d1ef43dde67cada11aeb15e064e2b90ed9bff57113f04268b70279b
    cases_sha256: 8d2dc084f321ff2387c88fb568b545137530e0da1ee1b89e70579df6647c39b0
    cases: 96
    split: tuning
    cohort: full_source
# Never named by any input, ledger, manifest or profile of this schedule (`check`). The names are
# the corpus directory names of the report splits; the hashes are contract §12
# `selection.forbidden_bundle_hashes`.
forbidden:
  bundle_hashes:
    - 85202b20c13685af6fd999fe3d228ca6de37abb5914b5459621e9a67a71971c0
    - 8213b7b07222c98a5ec99f0bae53d0876d2d14dc7dfd3cb7aa6cec1e20afe640
  names: [bundle_report, sor_cohort_report]

# ----------------------------------------------------------------------------- P* (§4)
# A P*-rendered profile (§4.4): schema_version 2, algorithms [id], objective / search / budget /
# measurement / worker copied verbatim from `canonical`, graph = `pstar_graph`, and
# algorithm_options {id: options} (omitted for an identity without options).
canonical: {path: config/full_gross.yaml,
            sha256: 51a8a65184ae765867fd9d7763776852b2b4576e3cf7116a8dc15ccd87028177}
m4_settings: {path: config/metis_challenge/m4.yaml,
              sha256: 661311df6ff7a36a43954fff0e42f6b30b824d35d96c06f0e215960f256d4471}
presets:                            # the base options S4 / REP run with, written out (byte-pinned)
  metis_history: {path: config/metis_history/preset_v1.yaml,
                  sha256: f4510b5181b1152786b0a637cd462734e31988b7890487c6ee6d396d37965799}
  incremental_graph_repair: {path: config/incremental_graph_repair/preset_v1.yaml,
                             sha256: 13774bcd2225ee17d3635bae509ac2a5a888d5c2801006a200e01788ca35786a}
pstar_graph: {chunks: 50, label_hops: 4, label_pruning: true}
profile_dir: config/research_024/profiles

# ----------------------------------------------------------------------------- selection (§5, §12)
# Verbatim copies of contract §12 `selection.identities`, `quality`, `work` and `rule`; `check`
# refuses any difference. The rule (tools/research_024/r024_rule.py) reads these values.
identities:
  split_polish:
    preset: {path: config/split_polish/preset_v1.yaml, key: R024-P01-split_polish, version: 1}
    id_format: "sp|{base}|{solver}|r{rounds}|t{tolerance}"
    grid:
      base: [incremental_graph, path_split, metis_inspired, metis_history,
             incremental_graph_repair]
      solver: [brent, golden]
      rounds: [1, 2, 4]
      tolerance: {"1e-3": 0.001, "1e-4": 0.0001, "1e-5": 0.00001}
    fixed: {grid: 1000000000, maxiter: 60}
    base_options_from_preset: [metis_history, incremental_graph_repair]
    candidates: 90
  marginal_activation:
    preset: {path: config/marginal_activation/preset_v1.yaml,
             key: R024-P02-marginal_activation, version: 1}
    id_format: "ma|{base}|{mode}|k{activations}|top{top_k}|d{delta_share}"
    grid:
      base: [incremental_graph, path_split]
      mode: [pf, full]
      activations: [1, 2, 4]
      top_k: [1, 3, 9]
      delta_share: {"1e-3": 0.001, "1e-4": 0.0001, "1e-5": 0.00001}
    fixed: {solver: brent, rounds: 2, tolerance: 0.0001, grid: 1000000000, maxiter: 60,
            seed_share: 0.0001, arm: treatment}
    candidates: 108
quality:
  reference_set: [incremental_graph, path_split, metis_inspired, metis_history,
                  incremental_graph_repair]
  failure_gross: 0
  weighting: equal_per_case
work:
  reference: incremental_graph
  units: [quotes, cl_swap_steps, lb_bins_swapped]
  limits: {quotes: 2, cl_swap_steps: 2, lb_bins_swapped: 2}
  zero_over_zero: 1
  positive_over_zero: infinite
rule:
  epsilon_bps: "1/100"
  tie_break: [quotes, cl_swap_steps, lb_bins_swapped, candidate_id]

# ----------------------------------------------------------------------------- reuse (§5.9)
# A configuration's 0.2.3 stage-T records replace its fresh run only if R1-R4 all hold for its
# ordinary run AND its work pass (`reuse` prints the outcome; `run` refuses to start while a
# registered configuration fails, so the inventory below is the executed one). `root` is the
# 0.2.3 stage-T directory relative to the artifacts root passed as `--artifacts`.
reuse:
  revision: 1bfd3f97fb205d21bb93acb754dfafcc1d851265
  root: research-023/campaign/1bfd3f97fb205d21bb93acb754dfafcc1d851265/T
  profiles: config/research_023/profiles
  sums: {path: docs/references/research-023/campaign/tuning-SHA256SUMS,
         sha256: 13c4b378b1e9e6145ebeb3e9ea7194937745c9524b280e5a96859e925bff9556}
  code_paths: [routing, pools, snapshot, benchmark, main.py,
               tools/research_022/pruning_work.py, uv.lock]
  environment_keys: [python_version, machine, dependencies]
  configurations:
    - {candidate: "ref|incremental_graph", r023_profile: a0, runs: [T-A0, T-WP-A0]}
    - {candidate: "ref|path_split", r023_profile: ps, runs: [T-PS, T-WP-PS]}
    - {candidate: "ref|metis_inspired", r023_profile: m4, runs: [T-M4, T-WP-M4]}
    - {candidate: "ref|metis_history", r023_profile: s4, runs: [T-S4, T-WP-S4]}
    - {candidate: "ref|incremental_graph_repair", r023_profile: rep, runs: [T-REP, T-WP-REP]}
    - {candidate: "sp|incremental_graph|brent|r2|t1e-4", r023_profile: e1b-a0,
       runs: [T-E1b-A0, T-WP-E1b-A0]}
    - {candidate: "sp|path_split|brent|r2|t1e-4", r023_profile: e1b-ps,
       runs: [T-E1b-PS, T-WP-E1b-PS]}
    - {candidate: "sp|metis_inspired|brent|r2|t1e-4", r023_profile: e1b-m4,
       runs: [T-E1b-M4, T-WP-E1b-M4]}
    - {candidate: "sp|metis_history|brent|r2|t1e-4", r023_profile: e1b-s4,
       runs: [T-E1b-S4, T-WP-E1b-S4]}
    - {candidate: "sp|incremental_graph_repair|brent|r2|t1e-4", r023_profile: e1b-rep,
       runs: [T-E1b-REP, T-WP-E1b-REP]}
    - {candidate: "sp|incremental_graph|golden|r2|t1e-4", r023_profile: e1g-a0,
       runs: [T-E1g-A0, T-WP-E1g-A0]}
    - {candidate: "ma|incremental_graph|pf|k2|top3|d1e-4", r023_profile: e2pf-a0,
       runs: [T-E2pf-A0, T-WP-E2pf-A0]}
    - {candidate: "ma|incremental_graph|full|k2|top3|d1e-4", r023_profile: e2full-a0,
       runs: [T-E2full-A0, T-WP-E2full-A0]}
  # Sensitivity arms (§5.10) reuse a 0.2.3 ordinary record only when CEC-equal (and R2-R4); these
  # are the only 0.2.3 stage-T configurations at another graph.chunks.
  sensitivity_sources:
    - {r023_profile: c100, run: T-C100}
    - {r023_profile: c200, run: T-C200}
    - {r023_profile: e1b-c100, run: T-E1b-C100}
    - {r023_profile: e2pf-c100, run: T-E2pf-C100}

# ----------------------------------------------------------------------------- stage I (§5.10, §6.2)
sensitivity:
  graph_chunks: [100, 200]
  not_applicable_bases: [path_split]   # does not read graph.chunks: neither arm runs
  work_pass: false
# The pinned stage-T analysis stage I is generated from (written by `analyze --stage T`).
selection_analysis: docs/references/research-024/selection/T-analysis.json

# ----------------------------------------------------------------------------- stages
# `lanes` = concurrent invocations. Stage T launches in descending registered cost estimate
# (contract §10.1 per-configuration lane-minutes; for E2 then K x top-k), each ordinary run
# followed by its work pass. The per-solve hard limits are P*'s (900 s, 300,000 quotes); a runner
# `timeout` is an outcome, never re-run. Wall time is never a selection input (§5.3 item 4).
stages:
  T: {split: tuning_full, lanes: 6, caffeinate: true, pmset_capture: true,
      owner: "the implementer, ONCE, from a fresh clone of the pushed schedule commit"}
  I: {split: tuning_full, lanes: 6, caffeinate: true, pmset_capture: true,
      owner: "the implementer, ONCE, from a fresh clone of the pushed commit carrying the presets"}
cost_estimate_lane_minutes:          # contract §10.1, launch order only
  split_polish: {incremental_graph: 40.2, path_split: 18.2, metis_inspired: 25.4,
                 metis_history: 27.0, incremental_graph_repair: 66.4}
  marginal_activation: {incremental_graph: {pf: 39.8, full: 63.6},
                        path_split: {pf: 24.3, full: 48.1}}
  reference: {incremental_graph: 32.9, path_split: 17.4, metis_inspired: 21.7,
              metis_history: 23.3, incremental_graph_repair: 62.8}
