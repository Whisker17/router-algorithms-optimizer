              sha256: 661311df6ff7a36a43954fff0e42f6b30b824d35d96c06f0e215960f256d4471}
presets:                            # the selected presets (WHI-1631), byte-pinned
  split_polish: {path: config/split_polish/preset_v1.yaml,
                 sha256: bdaba97b702c205fe6fae0b6ce2a439f550f8b0f263713c702789358f92dc533}
  marginal_activation: {path: config/marginal_activation/preset_v1.yaml,
                        sha256: 553ba71c8569eee67710587dda4a7e24e7dccee1f44ead6107944abc3db76cba}
# §12 roster.all19: the 19 rows `--strategies all` derives from `canonical` (live roster, all
# releases' additions), and the canonical sha256 of that derivation's resolved profile.
