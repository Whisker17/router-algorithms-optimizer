# WHI-1633 research-024 19-strategy campaign schedule (contract R024-C/1 §7, §8, §9, §10.2-§10.4, §12).
#
# The single machine-readable schedule of the 0.2.4 campaign: the inputs and their hashes, the
# 19-row roster `--strategies all` derives from `config/full_gross.yaml`, the quality arms of §7.2
# (group runs of that roster on both cohorts, the base-control decisions, the E2 attribution arms,
# the untimed work passes), the stages, the timing protocol L01-R024 of §8 and the pre-registered
# rules. Validated, rendered, executed, checked, analysed and tabulated ONLY by
# `tools/research_024/r024_campaign.py` (`profiles`, `check`, `freeze`, `inputs`, `run`, `timing`,
# `analyze`, `tables`); its pure analysis is `tools/research_024/r024_campaign_analysis.py`, the
# §5.4 gates and Rule P/M are `tools/research_024/r024_rule.py` (WHI-1631), all imported, never
# copied. Execution reuses the 0.2.1 executor (`tools/research_021/campaign.py`: ledger, lanes,
# 30-s load sampler, `caffeinate`, `pmset` capture, the single infrastructure retry) through the
# 0.2.2 driver (`tools/research_022/pruning_campaign.py`, which adds the work pass
# `tools/research_022/pruning_work.py`); no earlier campaign file is modified.
#
# This file and every generated profile are committed and PUSHED BEFORE STAGE T (§7.1). Every
# value below is the contract's (§12), `config/full_gross.yaml`'s or a selected preset's; `check`
# refuses a difference from the contract registry. Nothing here is tuned after observation.
#
# Stages (the 0.2.1 executor's stage letters):
#   T  every quality arm and work pass on the TUNING bundles (both cohorts), 6 lanes;
#   R  every quality arm and work pass on the REPORT bundles, ONCE, from a fresh clone of the freeze
#      commit (this file + the final analysis code, pushed before the first report-split solve);
#   L  the timing units of §8.2 (L01-R024), after R, alone on the host, one lane, from the freeze
#      commit, by `r024_campaign.py timing` (launch gate, triggers T1-T5, N = 3, first valid attempt).
schema: r024.campaign/1
issue: WHI-1633
contract: {key: R024-C/1, path: docs/references/research-024/contract.md,
           sha256: d458fbdefc501369cd10ec9d3d3527534df82d93cab20ff9af6dbd9ffe884065}
release: {version: 0.2.4, id: 0beaa4c3-2721-4618-b687-ac70d4d54e6a}
base_commit: b17e1192feb4e16314346f50edd53a75a8ba499b
holdout_exposure:
  tuning: exploration_data          # used to choose the 0.2.3 nominees and the 0.2.4 presets (§3)
  report: previously_exposed        # 0.1.0, 0.2.0, 0.2.1, 0.2.2, 0.2.3 (§9.2)
  all: matrix_and_sentinel          # stage L: the L01 matrix (tuning + held-out twins) and sentinel
host:
  logical_cpus: 10
  load_sample_seconds: 30

