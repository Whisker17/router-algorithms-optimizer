# P* graph (§4.4) for the separate arms rendered under P* (E2-E1only, E2-wm, E2-cm)
pstar_graph: {chunks: 50, label_hops: 4, label_pruning: true}
profile_dir: config/research_024/campaign_profiles

# Q19 group runs (§7.2: "registered group runs whose resolved per-identity values equal the derived
# roster's; `check` enforces it"). Each group profile is the 19-row `all` document restricted to the
# group: its `strategies` and `algorithm_options` entries, and its `selection` record restricted to
# the group with `mode: all` kept (so both R024 presets keep `source.kind: preset`, WHI-1632);
# every other section is the derived document's. The groups partition the 19 rows, each once; they
# are the timing units' identity sets (U1-U6) plus one group per new identity, so heavy rows run in
# parallel lanes. One profile per group serves both cohorts.
groups:
  u1: [direct, single_path, direct_split, path_split, incremental_graph]
  u2: [uni_sor_port]
  u3: [uni_sor_adaptive, uni_sor_optimized, metis_inspired, metis_history, direct_split_certified]
  u4: [incremental_graph_repair]
  u5: [uni_sor_cycle_safe]
  u6: [cfmm_dual, single_path_bounded, incremental_graph_bounded, metis_history_bounded]
  e1: [split_polish]
  e2: [marginal_activation]

# §7.2 base controls, DECIDED BY THE STATED RULE BEFORE STAGE T (accepted by the orchestrator,
# WHI-1633 comment 2026-10-08 11:30 UTC, decision 3). `check` re-derives each from the code and the
# profiles and refuses a schedule whose decision differs:
#  - BASE-<id>: the `Q19` row of the base identity serves iff, restricted to the keys the base
#    factory declares (`search_params`, `graph_params`, `graph_params_for`), its
#    `algorithm_config.params` equal those the post-processor hands its base, and its options equal
#    the preset's `base_options` (none when absent); otherwise a separate P* arm;
#  - E2-E1only: the `Q19` `split_polish` row serves iff it is CEC-equal (§4.3) to `split_polish`
#    with E2's base and E2's six E1 keys; otherwise a separate arm.
base_controls:
  BASE-E1: {post_processor: split_polish, base: metis_inspired, served_by: Q19,
            reason: "params equal on the 6 keys metis_inspired reads; no base_options, no row options"}
  BASE-E2: {post_processor: marginal_activation, base: incremental_graph, served_by: Q19,
            reason: "params equal on the 4 keys incremental_graph reads; no base_options, no row options"}
  E2-E1only: {post_processor: split_polish, served_by: arm,
              reason: "Q19 split_polish is metis_inspired/golden/1e-5, E2's E1 stage
                       incremental_graph/brent/1e-4: not CEC-equal"}
e1only_keys: [base, solver, rounds, tolerance, grid, maxiter]   # E2's E1 stage (R023-C/1 §5.3)

# The quality arms (§7.2). `q19` arms are one invocation per (group, cohort); the separate arms are
# P*-rendered single-identity profiles on the full cohort. `work_pass: true` adds the untimed twin
# `<stage>-WP-<id>` (none for the E2 controls, §7.2 / C14). `estimate` = report-split minutes of one
# invocation (§10.2 basis: the 0.2.2 / 0.2.3 report ledgers), used ONLY for the stage-T launch order.
arms:
  - {arm: Q19-full, kind: q19, cohort: full, work_pass: true}
  - {arm: Q19-sor, kind: q19, cohort: sor, work_pass: true}
  - {arm: E2-E1only, kind: e1only, cohort: full, work_pass: true}
  - {arm: E2-wm, kind: e2_control, e2_arm: work_matched, cohort: full, work_pass: false}
  - {arm: E2-cm, kind: e2_control, e2_arm: call_matched, cohort: full, work_pass: false}
estimate_minutes:
  q19-u1: 105
  q19-u2: 135
  q19-u3: 130
  q19-u4: 100
  q19-u5: 135
  q19-u6: 120
  q19-e1: 50
  q19-e2: 80
  e2-e1only: 65
  e2-wm: 150
  e2-cm: 150
# Contract §7.2 arms NOT scheduled; their earlier results stand as history.
not_scheduled: >-
  historical mechanism ablations: R021 E/L/S, same-grid allocation, repair off/on, cycle-safe SOR,
  CFMM CPMM-vs-CL, max_splits scan; R022 A2-A5; R023 golden control, E2-full ablation, C100/C200
  arms, CFMM + E1.

# C15 (descriptive): the 0.2.2 report-split records of the 17 earlier identities (R-A1 pair groups and
# R-B14 reference groups, both cohorts), located under the artifacts root and verified against the
# `cases_sha256` the committed 0.2.2 analysis pins.
