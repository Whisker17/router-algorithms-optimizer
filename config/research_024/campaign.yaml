             sha256: 468c4645e3c71600f59dbf938296999712703cd8eaed81d985b90322ee166f91}
  artifacts_marker: router-algorithms-optimizer-artifacts
  invocations: [R-A1-sp-full, R-A1-ig-full, R-A1-mh-full, R-B14-ra-full, R-B14-rb-full,
                R-B14-rc-full, R-B14-rd-full, R-A1-sp-sor, R-A1-ig-sor, R-A1-mh-sor,
                R-B14-ra-sor, R-B14-rb-sor, R-B14-rc-sor, R-B14-rd-sor]

# ----------------------------------------------------------------------------- stages
# `lanes` = concurrent invocations (one worker process each). T launches the ordinary invocations
# in descending `estimate_minutes`, full cohort first, then the work passes in the same order. R
# (registered here, before T, so nothing is settled after observation) launches in descending
# stage-T wall time of the same invocation (the T ledger; ties by the T order). Per-solve hard
# limits are the canonical budget (900 s, 300,000 quotes); a runner kill is a `timeout` outcome.
stages:
  T: {split: tuning, lanes: 6, caffeinate: true, pmset_capture: true, order: estimate,
      owner: "the implementer, from a fresh clone of the pushed schedule commit"}
  R: {split: report, lanes: 6, caffeinate: true, pmset_capture: true, order: stage_t_wall,
      owner: "the implementer, ONCE, from a fresh clone of the pushed freeze commit"}
  L: {split: all, lanes: 1, caffeinate: true, pmset_capture: true,
      owner: "the implementer, after R, alone on the host, from the freeze commit"}

# ----------------------------------------------------------------------------- timing (§8, §12)
# L01-R024: `config/latency/l01.yaml` with only `key` and the pinned `profile` replaced; the
# profile is the effective 19-identity `all` document of `canonical` at this commit, written out.
# The arms file defines the units UP (as two arms UP-base / UP-cand and their heuristic-lane
# comparison) and U1-U6; UQ is 5 sequential `main.py quote --details --strategies all --profile
# config/full_gross.yaml` processes on the sentinel of `full`. Every value below is §12 `timing`.
timing:
  protocol: {path: config/research_024/latency/l01-r024.yaml, key: L01-R024,
             source: config/latency/l01.yaml, replaced: [key, profile],
             source_sha256: 961fb52208c7baac3d0ffe492cef89818498543f1f00f56217d2f99113e27f1b}
  profile: {path: config/research_024/latency/all19.yaml}
  arms: {path: config/research_024/latency/timing-arms.yaml, key: L08-R024}
  sufficient_budget: {path: config/latency/l01-sufficient-budget.yaml,
                      sha256: 4059506da09280cdb0e8d4a94ac6ecef1c786113016e8eee430bef38089db43b}
  bundle: full
  units:
    - {unit: UP, kind: paired, candidate: [split_polish, marginal_activation],
       baseline: bases_of_selected_presets}
    - {unit: U1, kind: descriptive,
       algorithms: [direct, single_path, direct_split, path_split, incremental_graph]}
    - {unit: U2, kind: descriptive, algorithms: [uni_sor_port]}
    - {unit: U3, kind: descriptive,
       algorithms: [uni_sor_adaptive, uni_sor_optimized, metis_inspired, metis_history,
                    direct_split_certified]}
    - {unit: U4, kind: descriptive, algorithms: [incremental_graph_repair]}
    - {unit: U5, kind: descriptive, algorithms: [uni_sor_cycle_safe]}
    - {unit: U6, kind: descriptive,
       algorithms: [cfmm_dual, single_path_bounded, incremental_graph_bounded,
                    metis_history_bounded]}
    - {unit: UQ, kind: quote_cli, invocations: 5, strategies: all}
  quote_cli: {request: sentinel, profile: config/full_gross.yaml, strategies: all, details: true}
  max_started_attempts_per_unit: 3
  launch: {samples: 5, interval_seconds: 30, headroom_load1: 3.0,
           resample_every_seconds: 300, max_wait_seconds: 21600}
  validity: {max_load1_per_cpu: 0.5, sample_interval_seconds: 30, max_sample_gap_seconds: 90,
             sleep_entries_allowed: 0, caffeinate: "caffeinate -i -m -s"}
  triggers: [T1_load, T2_sampling_coverage, T3_sleep, T4_sleep_prevention_or_capture,
             T5_incomplete_execution]
  never_triggers: [solver_timeout, regression, insufficient_speedup, noisy_comparison,
                   l01_inconclusive, insufficient_cases, aa_noise, semantic_difference]
  outcomes: [valid, inconclusive_no_launch, inconclusive_cap_exhausted,
             inconclusive_protocol_breach]
  # T3 READING (orchestrator decision 2, WHI-1633 comment 2026-10-08 11:30 UTC; registered before
  # the schedule push and before stage T): literal. A `pmset -g log` line is `<date> <time> <tz>
  # <type><padding>\t<details>`; its TYPE COLUMN is the text between the timezone field and the
  # first tab, trailing blanks removed. Only an entry whose type column is EXACTLY one of
  # `trigger_types` and whose second lies inside the attempt window is trigger T3. Every other type
  # in the window (e.g. `Wake Requests`, `WakeDetails`, `WakeTime`, `Assertions`) is retained in
  # the attempt's capture and reported per attempt and type, never a trigger. A line without a
  # parsable timestamp and type column is retained and counted as `unparsed`.
  t3_reading:
    match: exact_type_column
    trigger_types: [Sleep, Wake, DarkWake]
    decision: "orchestrator, WHI-1633 comment 2026-10-08 11:30 UTC, decision 2"
  # Early abort (§8.4 item 2: only on a detected T1-T5 event; the abort and its reason are
  # recorded): the driver checks the stage's own 30-s load samples, the sampling gap and the
  # caffeinate process every 30 s, and the pmset log every 300 s, and aborts the attempt
  # (SIGTERM, then SIGKILL after 120 s) on a detected T1, T2, T3 or T4 event.
  monitor: {check_seconds: 30, pmset_check_seconds: 300, terminate_grace_seconds: 120}

# ----------------------------------------------------------------------------- rules
rules:
  one_pass: >-
    One frozen pass per arm and stage. The only re-execution is the 0.2.1 infrastructure deviation
    (`run --retry-infrastructure ID`: once, into `<id>.retry1`, only for an attempt that ended
    without a complete manifest, its reason recorded); a completed run is never repeated and a rerun
    never replaces a recorded outcome. A `timeout` or truncated row is an outcome. No record of an
    earlier campaign or of WHI-1631 is reused (§7.1).
  groups: >-
    `check`: the groups partition `all19` (each identity exactly once, roster order inside a group);
    every group profile equals its rendering, and per identity its resolved values (algorithm_config,
    options with their source and settings_sha256, strategies entry, and the shared objective, budget,
    measurement, worker, search and graph sections) equal the 19-row derivation's.
  gates: >-
    Contract §5.4 / §7.4 C12 per arm, against the base record of the SAME cohort and split: the Q19
    `split_polish` / `marginal_activation` rows and the `E2-E1only` arm G2-G7 (their base references:
    BASE-E1 = the Q19 `metis_inspired` row, BASE-E2 = the Q19 `incremental_graph` row; E2-E1only's
    base is incremental_graph = BASE-E2); `E2-wm` / `E2-cm` G2-G5 and G7, no G6, plus the §7.5
    control audit and C14; the other Q19 rows completeness, C1 and C13 only. Branches B0-B3 from the
    fields a record carries (`r024_rule.branch`).
  reconciliation: >-
    Rule P (§5.4.1) on every cell of every arm with a WP twin, whatever the identity; P2-P4 are
    labels, P5 is a defect. Rule M: a value a record does not carry is missing, never 0.
  check_problems: >-
    Exactly: a missing or duplicate scheduled record (G1 / C1), every defect (a §5.4 gate on an
    applicable branch per C12, a P5 `differs`, a K4 row, a failed §7.5 audit), plus the provenance
    checks (resolved profile, bundle hash, one source revision, a clean tree). Branches B0-B3, the
    P2-P4 labels, K0-K3 and `treatment_unavailable` are reported outcomes, not problems.
  ranking: >-
    §7.3: a pairwise comparison on a cohort is rankable iff both identities' protocol ceilings
    (`capabilities.protocols`; absent = all three families) intersected with the families present in
    that cohort's bundle are equal; non-rankable comparisons go to the expanded-protocol section,
    never ranked or pooled. SOR like-for-like statements come only from the sor cohort. C9(b): the
    envelope of a row on a cohort is, per case, the largest gross among the `ok` records of the Q19
    rows rankable with it on that cohort, the row itself included (an oracle, not a portfolio); a
    case where none is `ok` has no envelope value (counted as `no_ok_row`). Comparisons (C2-C6): a
    candidate vs a baseline over the identical schedule; bps = 10^4 (cand - base) / base on cases
    where both are `ok` and the base gross > 0 (exact rationals until the final float); base gross
    0 counted apart (`zero_baseline_na`); every status transition kept; nearest-rank percentiles;
    family = the case's (token_in, token_out); stratum per C6.
  disposition: >-
    §9.1 per new identity on the report split: `reject` on a defect of C12 / C13 on any record of the
    identity or its controls, an `invalid_plan` / `algorithm_error` where its base record of the same
    cohort and split is not the same status, a control above its work target or not call-matched, a
    refusal whose gross differs from the base record; else `inconclusive` when more than 1/10 of the
    identity's scheduled `report_full` cases are truncated (`truncated_by` set),
    `unsupported_topology`, branch B2, branch B0 with an `ok` base record, or carry a P2-P4 label, or
    a base or control arm is missing, or a scheduled arm is incomplete; else `keep_experimental`.
    The timing verdict is separate and never changes the disposition.
  timing: >-
    §8.4 exactly: per unit up to N = 3 started attempts, each after its own launch gate; an attempt
    is invalid iff T1-T5 holds in its window (T3 per `timing.t3_reading`); the first valid attempt by
    start time supplies the unit's result, whole attempts only; terminal outcomes valid (attempt id),
    inconclusive (no_launch), inconclusive (cap_exhausted), inconclusive (protocol_breach). No
    result is ever a trigger. An interrupted attempt (the driver died) counts as aborted (T5).
