          metis_history: metis_history_bounded}

# ----------------------------------------------------------------------------- stages
stages:
  T:
    split: tuning
    owner: the implementer, first (before any report-split solve)
    lanes: 5                        # concurrent invocations; timing here is descriptive only
    caffeinate: true
    pmset_capture: true
  R:
    split: report
    owner: the implementer, ONCE, from the freeze commit
    lanes: 5
    caffeinate: true
    pmset_capture: true
  M:
    split: tuning and report (A5, full_source only)
    owner: the implementer, from the freeze commit (the A5 values are fixed by the rule below)
    lanes: 5
    caffeinate: true
    pmset_capture: true
  I:
    split: fixture and sentinel (no corpus split)
    owner: the implementer, alone on the host
    lanes: 1
    caffeinate: true
    pmset_capture: true
  L:
    split: mixed (L01 matrix tuning cases + held-out twins, sentinel)
    owner: the implementer, alone on the host, ONCE, only after the exactness gate passed (§11.5)
    lanes: 1
    caffeinate: true
    pmset_capture: true
    # Launch policy (an operational choice, registered before the first tuning observation; the
    # pre-registered rules of contract §11.5 are unchanged). The headroom rule is the 0.2.1 one: five
    # 1-minute load samples 30 s apart, none above 3.0. Where that 0.2.1 gate gave up at once, this
    # stage WAITS: it re-samples every `resample_every_seconds` and launches the first time a
    # five-sample group passes. After `max_wait_seconds` without a pass it is NOT launched and the
    # timing verdict is `inconclusive` (no timing claim). Once launched there is no relaunch and no
    # repeat, whatever the verdict: a contaminated window is `inconclusive`, never rerun.
    launch_window: {samples: 5, interval_seconds: 30, headroom_load1: 3.0,
                    resample_every_seconds: 300, max_wait_seconds: 21600}

# ----------------------------------------------------------------------------- arms
# Expanded by `pruning_campaign.py` into invocations `<stage>-<arm>-<group>-<bundle>` (`full`/`sor`),
# plus `<stage>-WP-<arm>-<group>-<bundle>` work passes (pruning_work.py: `main.py run` with counting
# twins around the family quote functions; never an exactness or timing record) and, in stage R,
# the `report` child of every A1 run. Registered order = launch order (heaviest first). A5 is expanded
# from `a5` (stage M). The SOR cohort runs A1 only (the 0.2.1 roster precedent); A2-A5 run on the
# full five-source bundle.
arms:
  - {arm: B14, kind: reference_check, stages: {R: [report_full, report_sor]},
     groups: {ra: g_rest_a, rb: g_rest_b, rc: g_rest_c, rd: g_rest_d}}
  - {arm: A4, stages: {T: [tuning_full], R: [report_full]}, groups: {mh: a4_mh}, work_pass: true}
  - {arm: A3, stages: {T: [tuning_full], R: [report_full]}, groups: {mh: a3_mh}}
  - {arm: A1, stages: {T: [tuning_full, tuning_sor], R: [report_full, report_sor]},
     groups: {ig: g_ig, mh: g_mh, sp: g_sp}, work_pass: true, report: true}
  - {arm: A2, stages: {T: [tuning_full], R: [report_full]},
     groups: {ig: n_ig, mh: n_mh, sp: n_sp}}

# ----------------------------------------------------------------------------- A5
# Binding budgets (contract §11.3). The values are NOT chosen by hand: the rule below is applied by
# `pruning_campaign.py a5-values` to the reference records of the stage-T A1 run on `tuning_full`, and
# the result is written here in the freeze commit, before any report-split solve. The same values run
# on the tuning and the report split of the full_source bundle, bounded and reference in one run.
a5:
  rule: >-
    For each pair, over the reference's non-truncated `ok` cells of `T-A1-<group>-full`: p25 and p50
    (nearest rank, integer) of its `search.quotes_executed` (positive values only) become two
    `max_quotes` budgets, and of its `candidates_considered` (positive values only) two
    `max_candidates` budgets. A budget run replaces only that one `budget` key of the pair's A1 profile
    (the other stays as in the 0.2.1 budget); reference and bounded run in the same invocation.
    Reported separately under `not_exact_budget_binding`, never as exactness evidence.
  groups: {sp: g_sp, ig: g_ig, mh: g_mh}
  budgets: [{kind: max_quotes, p: 25}, {kind: max_quotes, p: 50},
            {kind: max_candidates, p: 25}, {kind: max_candidates, p: 50}]
  values:
    sp: {"max_quotes": {"p25": 911, "p50": 2960}, "max_candidates": {"p25": 1714, "p50": 4840}}
    ig: {"max_quotes": {"p25": 15456, "p50": 26358}, "max_candidates": {"p25": 90527, "p50": 229704}}
    mh: {"max_quotes": {"p25": 12733, "p50": 21559}, "max_candidates": {"p25": 24513, "p50": 30026}}

# ----------------------------------------------------------------------------- invocations
# Stages L and I are listed literally; T, R and M are expanded from `arms` / `a5`.
invocations:
