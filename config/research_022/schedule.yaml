# ----------------------------------------------------------------------------- profiles
# `path` + `sha256`: a pinned, never-edited file. `path` + `generate`: a file rendered by
# `pruning_campaign.py profiles --write` from the pinned base's `--strategies all` derivation (the
# 17-ID roster of contract §10.1) restricted to the listed `algorithms`; `check` refuses a file whose
# bytes differ from the rendering. Nothing but the listed `algorithms`, `options.set` and `budget` keys
# differs from the base's derived roster (a test enforces it), so every strategy runs with the values
# of `config/full_gross.yaml` (3 hops / 4 splits / 5 %, graph.chunks 50, M4 label settings, the 0.2.1
# budget, seed 1447) -- or, for the net arm A2, of `config/full.yaml`.
profiles:
  canonical_gross: {path: config/full_gross.yaml,
                    sha256: 51a8a65184ae765867fd9d7763776852b2b4576e3cf7116a8dc15ccd87028177}
  canonical_net: {path: config/full.yaml,
                  sha256: a99f33f8547a03ec6ff16f354b409a742d61db56921c45f88cbc26eb0887fab6}
  # A1 pair groups: each bounded strategy runs in the SAME run, with the same values, as its reference
  g_sp: {path: config/research_022/profiles/g_sp.yaml,
         generate: {base: canonical_gross, algorithms: [single_path, single_path_bounded]},
         purpose: "A1 pair: single_path / single_path_bounded"}
  g_ig: {path: config/research_022/profiles/g_ig.yaml,
         generate: {base: canonical_gross, algorithms: [incremental_graph, incremental_graph_bounded]},
         purpose: "A1 pair: incremental_graph / incremental_graph_bounded"}
  g_mh: {path: config/research_022/profiles/g_mh.yaml,
         generate: {base: canonical_gross, algorithms: [metis_history, metis_history_bounded]},
         purpose: "A1 pair: metis_history / metis_history_bounded (preset v1 under both keys)"}
  # the 11 remaining reference IDs, for the unchanged-versus-0.2.1 check (contract §11.2)
  g_rest_a: {path: config/research_022/profiles/g_rest_a.yaml,
             generate: {base: canonical_gross,
                        algorithms: [uni_sor_cycle_safe, direct, direct_split, direct_split_certified]},
             purpose: "the 14-reference check: group a"}
  g_rest_b: {path: config/research_022/profiles/g_rest_b.yaml,
             generate: {base: canonical_gross, algorithms: [uni_sor_port, uni_sor_optimized, cfmm_dual]},
             purpose: "the 14-reference check: group b"}
  g_rest_c: {path: config/research_022/profiles/g_rest_c.yaml,
             generate: {base: canonical_gross, algorithms: [incremental_graph_repair, uni_sor_adaptive]},
             purpose: "the 14-reference check: group c"}
  g_rest_d: {path: config/research_022/profiles/g_rest_d.yaml,
             generate: {base: canonical_gross, algorithms: [path_split, metis_inspired]},
             purpose: "the 14-reference check: group d"}
  # A2: the config/full.yaml empirical-cost objective
  n_sp: {path: config/research_022/profiles/n_sp.yaml,
         generate: {base: canonical_net, algorithms: [single_path, single_path_bounded]},
         purpose: "A2 pair under the empirical-cost objective"}
  n_ig: {path: config/research_022/profiles/n_ig.yaml,
         generate: {base: canonical_net, algorithms: [incremental_graph, incremental_graph_bounded]},
         purpose: "A2 pair under the empirical-cost objective"}
  n_mh: {path: config/research_022/profiles/n_mh.yaml,
         generate: {base: canonical_net, algorithms: [metis_history, metis_history_bounded]},
         purpose: "A2 pair under the empirical-cost objective"}
  # A3 / A4: metis_history pair with the generous caps; A4 additionally dominance off
  a3_mh: {path: config/research_022/profiles/a3_mh.yaml,
          generate: {base: canonical_gross, algorithms: [metis_history, metis_history_bounded],
                     options: {metis_history: {set: {dominance: history,
                                                         max_labels_per_signature: 1000000,
                                                         max_frontier_labels: 10000000}},
                                   metis_history_bounded: {set: {dominance: history,
                                                                 max_labels_per_signature: 1000000,
                                                                 max_frontier_labels: 10000000}}}},
          purpose: "A3: dominance history, 10^6 labels per signature, 10^7 frontier labels"}
  a4_mh: {path: config/research_022/profiles/a4_mh.yaml,
          generate: {base: canonical_gross, algorithms: [metis_history, metis_history_bounded],
                     options: {metis_history: {set: {dominance: "off",
                                                     max_labels_per_signature: 1000000,
                                                     max_frontier_labels: 10000000}},
                               metis_history_bounded: {set: {dominance: "off",
                                                             max_labels_per_signature: 1000000,
                                                             max_frontier_labels: 10000000}}}},
          purpose: "A4: A3 with dominance off (G_M2 open where parallel routes exist; M2 can act)"}
  # timing / single-request: the six pair strategies (L01 rules over the unchanged full_gross values)
  timing_pairs: {path: config/research_022/profiles/timing_pairs.yaml,
                 generate: {base: canonical_gross,
                            algorithms: [single_path, single_path_bounded, incremental_graph,
                                         incremental_graph_bounded, metis_history,
                                         metis_history_bounded]},
                 purpose: "stage L and the single-request checks: the six pair strategies"}

