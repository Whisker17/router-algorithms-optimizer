  - {id: I-batch17, stage: I, kind: run, bundle: fixture, profile: canonical_gross, strategies: all,
     algorithms: &all17 [direct, single_path, direct_split, path_split, incremental_graph,
                         uni_sor_port, uni_sor_adaptive, uni_sor_optimized, metis_inspired,
                         metis_history, direct_split_certified, incremental_graph_repair,
                         uni_sor_cycle_safe, cfmm_dual, single_path_bounded,
                         incremental_graph_bounded, metis_history_bounded],
     derive: [report, replay, order_check]}
  - {id: I-quote-details, stage: I, kind: quote, bundle: full, profile: canonical_gross,
     strategies: all, details: true, request: sentinel, algorithms: *all17,
     derive: [report, replay, order_check]}
  - {id: I-quote-compact, stage: I, kind: quote, bundle: full, profile: canonical_gross,
     strategies: all, details: false, request: sentinel, algorithms: *all17,
     derive: [report, replay, order_check]}
  # ---- L: quiet-host timing (contract §11.5): the L01 protocol rules over the six pair strategies;
  # the baseline experiment is the three references, the candidate the three bounded strategies,
  # compared pairwise (`--lane heuristic --pair BOUNDED=REFERENCE`: only that lane pairs different IDs;
  # exactness is the §11.2 gate, not this comparison). The five `quote --details` are the
  # single-request checks (descriptive, one solve per strategy per invocation).
  - {id: L-ref, stage: L, kind: l01_run, arm: REF, bundle: full}
  - {id: L-bnd, stage: L, kind: l01_run, arm: BND, bundle: full, after: [L-ref]}
  - {id: L-cmp, stage: L, kind: l01_compare, baseline: L-ref, candidate: L-bnd, after: [L-bnd]}
  - {id: L-q1, stage: L, kind: quote, bundle: full, profile: timing_pairs, strategies: profile,
     details: true, request: sentinel, algorithms: &pairs6 [single_path, single_path_bounded,
     incremental_graph, incremental_graph_bounded, metis_history, metis_history_bounded],
     after: [L-cmp]}
  - {id: L-q2, stage: L, kind: quote, bundle: full, profile: timing_pairs, strategies: profile,
     details: true, request: sentinel, algorithms: *pairs6, after: [L-q1]}
  - {id: L-q3, stage: L, kind: quote, bundle: full, profile: timing_pairs, strategies: profile,
     details: true, request: sentinel, algorithms: *pairs6, after: [L-q2]}
  - {id: L-q4, stage: L, kind: quote, bundle: full, profile: timing_pairs, strategies: profile,
     details: true, request: sentinel, algorithms: *pairs6, after: [L-q3]}
  - {id: L-q5, stage: L, kind: quote, bundle: full, profile: timing_pairs, strategies: profile,
     details: true, request: sentinel, algorithms: *pairs6, after: [L-q4]}

