# ----------------------------------------------------------------------------- rules
rules:
  exactness: >-
    Contract §11.2 on every non-truncated cell of A1-A4: a cell is non-truncated when neither side
    has a failed attempt (timeout incl. a `max_quotes` hard stop, worker error, missing record) and
    both report `truncated_by` in {null, state_cap} and no truncated stage other than the strategy's
    own name. Identical means: status, error, score, evaluation (the runner's independent replay of
    the submitted plan, canonical JSON: pools, token pair, input funds and amounts per step),
    solver-reported outcome, `candidates_considered`/`candidates_truncated` (not under an active M2),
    and every `search` key outside the §8.1 allowed-to-differ column are equal; the bounded `search` has
    exactly the reference's keys plus `bound_pruning`. A cell with a truncated side is excluded and
    listed; `bounded truncated and reference not truncated` is a separate list (target empty). Any
    difference is a blocking defect for that strategy: recorded with a reproduction command, never a
    tuning input, never a reason to change a cell set, a grid or a budget.
  baseline: >-
    The 14 reference IDs on the report split at HEAD against the 0.2.1 baseline records
    (`baseline_021`): the deterministic view of each record (status, evaluation, score, error,
    candidates, `search`, quotes counted, solver-reported outcome, seed) must be equal; a difference
    is reported per cell, not explained away.
  work: >-
    Contract §11.4: per pair, per case family (cohort, direct-pool vs no-direct, pool-family mix of
    the reference plan, stratum, directed pair), sums and n/p50/p90/max of each unit separately;
    ratios only bounded/reference of the same unit; a missing value is counted, never 0; the bound's
    own cost (`bound_evaluations`, `bound_table_cost`, `bound_prepare` from the runner's prepare events)
    is reported beside the savings, never netted. CL steps and LB bins come from the work pass (A1 on
    both cohorts and splits; A4 on full_source), which also cross-checks its executed-quote count
    against the meter and `search.quotes_executed` and its outcome against the ordinary run.
  timing: >-
    Contract §11.5: attempted only after the exactness gate passed; L01 rules (warm process, 1 warm-up
    + 5 repeats, orders fixed and reverse, the A/A noise floor of each experiment, the held-out
    decision split, the 10 % minimum worthwhile improvement and 2x noise rule) run by `report.latency
    compare` over `config/research_022/l01-r022.yaml`. A window with any sampled 1-minute load above
    0.5 x logical CPUs, any host `Sleep` transition, or no load sample or no sleep log is
    `inconclusive`: no speed claim, no timing disposition. A passed window yields, per strategy, the
    comparison's per-pair verdict mapped faster -> `improvement`, no_worthwhile_change ->
    `no_difference`, slower -> `regression`. Cold = the comparison's charged cold stage (fresh worker,
    prepare + solve); warm = solve only; prepare is its own number; memory is the separate tracemalloc
    pass of the cold stage. Timing is never repeated for a better verdict.
  disposition: >-
    Contract §11.6 per bounded strategy: `reject` if the exactness gate fails on any non-truncated cell
    or the bounded run returns invalid_plan / algorithm_error where its reference did not;
    `inconclusive` if exactness holds but a registered question cannot be evaluated (no cell with
    `pruned_bound > 0`, missing or incomplete records); otherwise `keep_experimental`, "work reduction
    only", unless the timing gate passed and the verdict is `improvement` ("work and latency"). No
    default is changed and nothing is adopted.
  operations: >-
    Operational choices registered before the first tuning observation (none changes a §11 rule):
    (1) one invocation per pair group and per group of the 11 other references instead of one
    `--strategies all` run per bundle (each group's values are the roster's, a test enforces it), so
    the heavy strategies run in parallel lanes; every bounded strategy runs in the same run as its
    reference. (2) A2-A5 run on the full_source cohort only. (3) The work pass covers A1 and A4. (4) The
    stage-I matrix runs `--strategies all` (17 IDs) over the tracked fixture bundle and the sentinel
    quote, with their report / replay / order-check. (5) Stages R and M execute from the freeze commit
    (this file with `a5.values`); analysis code is unchanged between the commit that first contains it
    and the freeze commit except for disclosed fixes. (6) The infrastructure retry of the 0.2.1
    deviation rule is the only re-execution (`<id>.retry1`); a completed run is never repeated.
