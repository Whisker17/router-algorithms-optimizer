# WHI-1602 research-022 campaign schedule (R022-Q06; pruning contract R022-Q02/1 §11, §14).
#
# The single machine-readable schedule of the 0.2.2 exactness / work / timing campaign: inputs and
# their hashes, every profile (generated from the unchanged canonical bases), every invocation of
# every stage, the registered A5 budget rule, the timing launch policy and the pre-registered
# rules. Validated, expanded, executed and analysed ONLY by `tools/research_022/pruning_campaign.py`
# (`check`, `profiles`, `schedule`, `inputs`, `execute`, `a5-values`, `analyze`); explained in
# docs/references/research-022/results.md. It reuses the 0.2.1 executor by import
# (`tools/research_021/campaign.py`, never modified) and writes nothing under config/research_021.
#
# Stages: T = tuning split (checks: defects, gate behaviour, budgets), executed from a clean clone of
# the commit that first contains this file, before any other observation; R = the report split,
# executed ONCE from the freeze commit (this file with `a5.values` filled from stage T), never tuned
# on; M = the binding-budget arm A5 on both splits (values fixed by the rule below, from the freeze
# commit); L = quiet-host timing (§11.5); I = the CLI invocation matrix over all 17 IDs (batch,
# single request, report, replay, order-check). Nothing here is an adoption, a default change or a
# loss tolerance.
schema: r022.campaign/1
issue: WHI-1602
publication_key: R022-Q06
contract: R022-Q02/1
contract_doc: docs/references/research-022/pruning-contract.md
release: {version: 0.2.2, id: fca63897-b103-46f4-a690-c297246ed1ff}
base_commit: 86a6fd3b6c59e32d26d5fe931d1177e867735719
holdout_exposure:
  tuning: exploration_data
  report: previously_exposed        # R021-C/1 §6.1; executed once (contract §11.1)
  l01_matrix: previously_exposed (L01 matrix = tuning cases + held-out report twins)
host:
  logical_cpus: 10                  # reference Apple M2 Pro; the load threshold uses the host's
  load_sample_seconds: 30
  contaminated_if: load1 > 0.5 * logical_cpus      # 5.0 on the 10-core host (contract §11.5)

